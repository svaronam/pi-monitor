<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1412">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<title>Pi Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1412;--nav:#131A17;--card:#18201C;--card2:#1E2823;--line:#26302B;--line2:#3A4740;
  --txt:#E8EDEA;--mut:#9AA8A1;--mut2:#B5C1BB;--dim:#6B7A73;
  --ok:#4ADE80;--ok-bg:#123326;--ok-line:#2F5E40;--ok-txt:#86EFAC;
  --warn:#FBBF24;--warn-bg:#2A2312;--warn-line:#5C4A1A;--warn-txt:#FDE68A;--warn-mut:#D6C38A;
  --bad:#F87171;--bad-bg:#2A1414;--bad-line:#5A2424;--bad-txt:#FCA5A5;
  --blue-bg:#15233A;--blue-line:#2F4A6B;--blue-txt:#93C5FD;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --sans:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt)}
body{font:15px/1.4 var(--sans);min-height:100vh}
a{color:var(--ok);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
button:active{transform:scale(.97)}
button:disabled{opacity:.5}
code,.mono{font-family:var(--mono)}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{padding:calc(20px + env(safe-area-inset-top)) 20px 10px;display:flex;align-items:center;gap:10px}
.top .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.top h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:13px;color:var(--mut)}
.top.back{padding:calc(14px + env(safe-area-inset-top)) 12px 4px;gap:4px}
.ib{width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;position:relative;padding:0}
.ib.plain{border:0;background:transparent}
.ib .badge-dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--ok)}
main{flex:1;padding:4px 16px calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--nav);border-top:1px solid var(--line);padding:8px 8px calc(10px + env(safe-area-inset-bottom))}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:48px;color:var(--mut);font-size:12px}
.nav button.on{color:var(--ok);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.sm{border-radius:14px;padding:12px 14px}
.card h2,.sec-t{margin:0;font-size:15px;font-weight:600}
.sec-t{margin:0 4px}
.sep{height:1px;background:var(--line)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.tile b{font-size:22px;font-weight:700}.tile span{font-size:12px;color:var(--mut)}
.banner{display:flex;gap:12px;align-items:center;border-radius:14px;padding:12px 14px;border:1px solid var(--warn-line);background:var(--warn-bg);color:var(--warn-txt);text-align:left;width:100%}
.banner.bad{border-color:var(--bad-line);background:var(--bad-bg);color:var(--bad-txt)}
.banner .bt{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.banner .bt b{font-size:14px;font-weight:600}.banner .bt span{font-size:12px;opacity:.85}
.pihead{display:flex;align-items:center;justify-content:space-between;gap:10px;background:none;border:0;padding:0;text-align:left;width:100%;min-height:32px}
.pihead .n{display:flex;align-items:center;gap:10px;min-width:0}
.pihead h2{margin:0;font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pihead .up{font-family:var(--mono);font-size:12px;color:var(--mut);display:flex;align-items:center;gap:4px;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--dim)}
.dot.sm{width:8px;height:8px}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}.dot.off{background:#3A4740}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;font-family:var(--mono)}
.metrics div{display:flex;flex-direction:column;gap:2px}
.metrics b{font-size:15px;font-weight:500}.metrics span{font-size:11px;color:var(--mut)}
.w{color:var(--warn)!important}.r{color:var(--bad)!important}.g{color:var(--ok)!important}
.botrow{display:flex;align-items:center;gap:8px}
.botrow .lk{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:44px;background:none;border:0;padding:0;text-align:left;color:var(--txt)}
.botrow .lk.offn{color:var(--dim)}
.botrow .nmw{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;padding:4px 0}
.botrow .nm{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.botrow .ad{font:12px var(--mono);color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.botrow .lk.offn .ad{color:var(--dim)}
.botrow .ad.ln{align-self:flex-start;max-width:100%;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.botrow .ad.ln:hover,.botrow .ad.ln:focus-visible{color:var(--blue-txt);text-decoration-style:solid;outline:none}
a.pill{display:inline-flex;align-items:center;gap:6px}
.botrow .in{flex:none;font-size:12px;color:var(--mut);max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{flex:none;width:52px;height:44px;border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center}
.sw i{width:40px;height:24px;border-radius:999px;background:#2E3833;display:flex;align-items:center;justify-content:flex-start;padding:3px;transition:background .15s}
.sw i::after{content:"";width:18px;height:18px;border-radius:50%;background:#8A9891;transition:transform .15s}
.sw.on i{background:var(--ok);justify-content:flex-end}.sw.on i::after{background:var(--bg)}
.sw.busy{opacity:.5;pointer-events:none}
.swsp{flex:none;width:52px}
.dashed{min-height:48px;border-radius:14px;border:1px dashed var(--line2);background:transparent;color:var(--mut);font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:13px;font-weight:500}
.chip.on{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.grp{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;padding:4px 4px 0}
.ev{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;width:100%;color:var(--txt)}
.tag{flex:none;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:500}
.tag.s{width:32px;height:32px;border-radius:9px}
.c-wallapop{background:#123326;color:#86EFAC}.c-opos{background:#1A2A44;color:#93C5FD}.c-diecast{background:#3A2410;color:#FDBA74}
.c-musica{background:#2E1A3D;color:#D8B4FE}.c-sistema{background:#3A1717;color:#FCA5A5}.c-otros{background:#232B33;color:#CBD5E1}
.ev .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ev .meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mut);font-family:var(--mono)}
.ev .meta span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .ti{font-size:15px;font-weight:500;line-height:1.3;word-break:break-word}
.ev .de{font-size:13px;color:var(--mut2);line-height:1.35;word-break:break-word}
.empty{text-align:center;padding:36px 12px;color:var(--mut);display:flex;flex-direction:column;gap:14px;align-items:center}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;background:#2A2F2D;color:#C9D2CD}
.pill.ok{background:var(--ok-bg);color:var(--ok-txt)}.pill.warn{background:#3A2E10;color:var(--warn-txt)}.pill.bad{background:var(--bad-bg);color:var(--bad-txt)}
.pill.ln{background:var(--card);border:1px solid var(--line);color:var(--mut2);font-weight:400}
.pill.mono{font-family:var(--mono);font-weight:400}
.ttl{display:flex;flex-direction:column;gap:8px;padding:0 4px}
.ttl h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.5px;word-break:break-word}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.acts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.act{min-height:64px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px}
.acts.two .act{min-height:56px;flex-direction:row;gap:8px;font-size:14px}
.act.ok{border-color:var(--ok-line);background:var(--ok-bg);color:var(--ok-txt)}
.act.bad{border-color:var(--bad-line);background:var(--bad-bg);color:var(--bad-txt)}
.act.blue{border-color:var(--blue-line);background:var(--blue-bg);color:var(--blue-txt)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;min-height:22px}
.kv>span:first-child{color:var(--mut)}
.kv>span:last-child{text-align:right;word-break:break-word}
.kv .mono{font-size:14px}
.runs{display:flex;gap:3px;height:28px;align-items:stretch}
.runs i{flex:1;border-radius:4px}
.box{min-height:36px;padding:0 6px 0 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-family:var(--mono);font-size:14px;display:flex;align-items:center;gap:6px}
.box button{width:28px;height:28px;border:0;background:transparent;color:var(--mut);display:flex;align-items:center;justify-content:center;padding:0}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.days button{min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--mut);font-size:13px;font-weight:600;padding:0}
.days button.on{border-color:var(--ok-line);background:var(--ok-bg);color:var(--ok-txt)}
.wrap{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:14px;font-weight:600;padding:0 14px}
.btn.pri{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.btn.blue{border-color:var(--blue-line);background:var(--blue-bg);color:var(--blue-txt)}
.btn.bad{border-color:var(--bad-line);background:var(--bad-bg);color:var(--bad-txt)}
.btn.sm{min-height:36px;font-size:13px;padding:0 12px}
.btn.full{width:100%}
.log{background:#0A0E0C;border:1px solid var(--line);border-radius:14px;padding:12px;font:11.5px/1.6 var(--mono);color:var(--mut2);white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto;margin:0}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{min-height:40px;border-radius:9px;border:0;background:transparent;color:var(--mut);font-size:14px;font-weight:600}
.seg button.on{background:#2A3530;color:var(--txt)}
.chart .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.chart .hd span{font-family:var(--mono);font-size:12px;color:var(--mut)}
.chart .hd b{color:var(--txt);font-size:15px;font-weight:500}
.bars{display:flex;align-items:flex-end;gap:2px;height:64px}
.bars i{flex:1;border-radius:2px 2px 0 0;min-height:2px}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);font-family:var(--mono)}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--bg)}
.leg{display:flex;flex-direction:column;gap:6px;font-size:13px}
.leg div{display:flex;justify-content:space-between;gap:8px}
.leg div span:first-child{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leg i{width:10px;height:10px;border-radius:3px;flex:none}
.card.warnc{background:var(--warn-bg);border-color:var(--warn-line)}
.card.warnc h2{color:var(--warn-txt)}
.card.okc{background:var(--ok-bg);border-color:var(--ok-line)}
.big{margin:0;font-size:17px;line-height:1.4;font-weight:500}
.lab{font-size:12px;text-transform:uppercase;letter-spacing:1px}
.mut{color:var(--mut);font-size:13px}
.reasons{margin:0;padding:0;list-style:none;font-size:13px;display:flex;flex-direction:column;gap:4px}
.reasons li.bad{color:var(--bad-txt)}.reasons li.warn{color:var(--warn-txt)}
.svc{display:flex;align-items:center;gap:10px;min-height:44px;flex-wrap:wrap}
.svc .n{flex:1;min-width:120px;word-break:break-word}
.svc .n b{font-weight:500}
.svc .bt{display:flex;gap:6px;flex-wrap:wrap}
select,input:not([type=checkbox]){font:inherit;color:var(--txt);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-height:44px}
input[type=time]{width:auto;font-family:var(--mono);min-height:36px;padding:4px 10px}
select.inl{width:auto;min-height:36px;padding:4px 10px;font-family:var(--mono);font-size:14px}
input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--ok)}
label.f{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
label.chk{display:flex;gap:12px;align-items:center;justify-content:space-between;font-size:14px;min-height:44px}
label.chk span{display:flex;flex-direction:column;gap:2px}
label.chk small{font-size:12px;color:var(--mut)}
.modal{position:fixed;inset:0;background:rgba(5,8,7,.72);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;border-top:1px solid var(--line);padding:22px 20px calc(26px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.sheet h2{margin:0 0 8px;font-size:19px;font-weight:700}
.sheet p{margin:6px 0;font-size:14px;color:var(--mut2);line-height:1.45}
.sheet .row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.sheet .col{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.sheet pre{background:#0A0E0C;border:1px solid var(--line);border-radius:12px;padding:10px;font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;max-height:55vh;overflow:auto;margin:8px 0 0;color:var(--mut2)}
.qk{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.qk button{font:12px var(--mono);padding:6px 9px;border-radius:9px;border:1px solid var(--line);background:var(--card2);color:var(--txt)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:10px 14px;border-radius:12px;z-index:30;display:none;max-width:90vw;font-size:14px}
.note{font-size:12px;color:var(--mut);line-height:1.4}
svg{flex:none}
@media (max-width:360px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles b{font-size:19px}}
</style>
</head>
<body>
<div class="app">
  <div id="top"></div>
  <main id="view"></main>
</div>
<nav class="nav" id="nav"><div class="in">
  <button data-v="inicio" onclick="go('inicio',{},true)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Inicio</button>
  <button data-v="feed" onclick="go('feed',{},true)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/></svg>Feed</button>
  <button data-v="resumen" onclick="go('resumen',{},true)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18"/></svg>Resumen</button>
</div></nav>
<div class="modal" id="modal"><div class="sheet" id="sheet" role="dialog"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jsq = s => esc(String(s ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'"));
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
};

// ================================================================ puente con la APK
// Dentro de la APK existe window.PiNative: guarda las Pi en Android (para el servicio de avisos) y hace las peticiones HTTP.
const NATIVE = window.PiNative || null;
function loadPis() {
  if (NATIVE) { try { const l = JSON.parse(NATIVE.getPis() || '[]'); if (l.length) return l } catch {} }
  return store.get('pimon.pis', []);
}
function savePis() { store.set('pimon.pis', pis); if (NATIVE) NATIVE.setPis(JSON.stringify(pis)) }
function nativeAjustes() { try { return Object.assign({ avisos: true, caida_min: 3 }, JSON.parse(NATIVE.getAjustes() || '{}')) } catch { return { avisos: true, caida_min: 3 } } }
const pending = {}; let reqSeq = 0;
window.__piResolve = (id, status, text) => { const f = pending[id]; if (f) { delete pending[id]; f({ status, text }) } };
function nativeFetch(url, method, headers, body, timeout) {
  return new Promise(resolve => { const id = ++reqSeq; pending[id] = resolve; NATIVE.http(id, method, url, JSON.stringify(headers), body || '', timeout) });
}

let pis = loadPis();
if (NATIVE && pis.length) savePis();
let settings = Object.assign({ telegram: { token: '', chat_id: '' }, alerts: { temp: 75, disk: 90, offline_after: 3, boot: true, shutdown: true }, heartbeat_url: '', resumen: { activo: true, hora: '22:00' } }, store.get('pimon.settings', {}));
settings.resumen = Object.assign({ activo: true, hora: '22:00' }, settings.resumen || {});

async function api(pi, path, opts = {}, timeout = 8000) {
  if (NATIVE) {
    const headers = { 'Authorization': 'Bearer ' + pi.token, ...(opts.body ? { 'Content-Type': 'application/json' } : {}) };
    const r = await nativeFetch(pi.url.replace(/\/+$/, '') + path, opts.method || 'GET', headers, opts.body, timeout);
    if (r.status === -1) throw new Error('Sin respuesta (¿apagada o fuera de red?)');
    if (r.status === 0) throw new Error('No se puede conectar' + (r.text ? ' (' + r.text + ')' : ''));
    let j = {}; try { j = JSON.parse(r.text) } catch {}
    if (r.status === 404 && j.error === 'no existe') throw new Error('Agente antiguo: vuelve a ejecutar install.sh en esta Pi');
    if (r.status < 200 || r.status >= 300) throw new Error(j.error || 'HTTP ' + r.status);
    return j;
  }
  const ctl = new AbortController(); const h = setTimeout(() => ctl.abort(), timeout);
  try {
    const r = await fetch(pi.url.replace(/\/+$/, '') + path, {
      ...opts, signal: ctl.signal,
      headers: { 'Authorization': 'Bearer ' + pi.token, ...(opts.body ? { 'Content-Type': 'application/json' } : {}) }
    });
    const j = await r.json().catch(() => ({}));
    if (r.status === 404 && j.error === 'no existe') throw new Error('Agente antiguo: vuelve a ejecutar install.sh en esta Pi');

function health(c) {

  if (s.disk.percent >= Math.max(dlim, 95)) add('bad', `SD casi llena (${Math.round(s.disk.percent)} %)`); else if (s.disk.percent >= Math.min(dlim, 85)) add('warn', `SD al ${Math.round(s.disk.percent)} %`);
  if (s.memory.percent >= 92) add('warn', `RAM al ${Math.round(s.memory.percent)} %`);

  }

  for (const v of s.services) if (v.ActiveState !== 'active' && !s.failed_units.includes(v.name) && !bots.has(v.name)) add('warn', `${v.name}: ${v.LoadState === 'not-found' ? 'no existe' : v.ActiveState}`);

}

function renderFeed() {
  setTop(`<div class="top"><div class="t"><h1>Feed</h1><span class="sub">Todo lo que han detectado tus bots</span></div>
    <button class="ib" aria-label="Actualizar" onclick="toast('Actualizando…',1000);refreshAll()">${ICO.refresh}</button></div>`);
  const list = allEvents().map(e => ({ e, v: evView(e) }));
  const present = new Set(list.map(x => x.v.cat));
  const chips = [['todos', 'Todos'], ...Object.entries(CATS).filter(([k]) => present.has(k)).map(([k, v]) => [k, v[0]])];
  if (!chips.some(c => c[0] === feedCat)) feedCat = 'todos';
  const shown = list.filter(x => feedCat === 'todos' || x.v.cat === feedCat).slice(0, 300);
  let html = `<div class="chips" role="group" aria-label="Filtrar">${chips.map(([k, t]) => `<button class="chip ${k === feedCat ? 'on' : ''}" aria-pressed="${k === feedCat}" onclick="feedCat='${k}';render()">${esc(t)}</button>`).join('')}</div>`;
  if (!shown.length) html += `<div class="empty"><p>${list.length ? 'Nada en esta categoría.' : 'Todavía no hay eventos. Aparecerán aquí cuando tus bots o tus Pi avisen de algo.'}</p></div>`;
  let last = '';
  for (const { e, v } of shown) {
    const g = dayLabel(e.ts);
    if (g !== last) { html += `<div class="grp">${g}</div>`; last = g }
    const b = e.bot && (st(e.pi.id)?.bots || []).find(x => x.label === e.bot);
    const onclick = b ? `go('bot',{pi:'${e.pi.id}',unit:'${jsq(b.unit)}'})` : `go('pi',{pi:'${e.pi.id}'})`;
    html += `<button class="ev" onclick="${onclick}"><span class="tag c-${v.cat}">${esc(v.tag)}</span>
      <span class="b"><span class="meta"><span>${esc(v.who)} · ${esc(e.pi.name)}</span><span>${hhmm(e.ts)}</span></span>
      <span class="ti">${esc(v.title)}</span>${v.detail ? `<span class="de">${esc(v.detail)}</span>` : ''}</span></button>`;
  }
  $('#view').innerHTML = html;
}

// ================================================================ RESUMEN
const resumenes = {};
async function loadResumen(fecha) {
  const r = await Promise.all(pis.map(async pi => { try { return { pi, r: await api(pi, '/api/resumen?fecha=' + fecha, {}, 10000) } } catch (e) { return { pi, error: e.message } } }));
  resumenes[fecha] = { at: Date.now(), items: r };
  if (route.v === 'resumen') render();
}
function shiftDay(f, n) { const [y, m, d] = f.split('-').map(Number); const x = new Date(y, m - 1, d); x.setDate(x.getDate() + n); return ymd(x) }
function renderResumen() {
  const fecha = route.fecha || todayStr(), isToday = fecha === todayStr();
  setTop(`<div class="top" style="align-items:flex-end"><div class="t"><span class="sub">${fechaLarga(fecha)}</span><h1>Resumen del día</h1></div>
    <div style="display:flex;gap:4px">
      <button class="ib" style="width:40px;height:40px" aria-label="Día anterior" onclick="route.fecha='${shiftDay(fecha, -1)}';render();loadResumen(route.fecha)">${ICO.back.replace(/22/g, '18')}</button>
      <button class="ib" style="width:40px;height:40px;${isToday ? 'opacity:.4' : ''}" aria-label="Día siguiente" ${isToday ? 'disabled' : ''} onclick="route.fecha='${shiftDay(fecha, 1)}';render();loadResumen(route.fecha)">${ICO.chev.replace(/16/g, '18')}</button></div></div>`);
  const R = resumenes[fecha];
  if (!R) { $('#view').innerHTML = `<p class="mut" style="padding:20px 4px">Cargando…</p>`; return }
  const ok = R.items.filter(x => x.r);
  const tot = ok.reduce((a, x) => a + x.r.eventos_bots, 0), fallos = ok.reduce((a, x) => a + x.r.fallos, 0), rein = ok.reduce((a, x) => a + x.r.reinicios, 0);
  const cats = {};
  for (const x of ok) for (const b of x.r.por_bot) {
    const c = cats[catOf(b.cat)] ||= { n: 0, bots: [], ult: [] };
    c.n += b.eventos; c.bots.push(`${b.bot} (${b.eventos})`); c.ult.push(...b.ultimos);
  }
  const ordered = Object.entries(cats).sort((a, b) => b[1].n - a[1].n);
  const top = ordered.slice(0, 2).map(([, c]) => c.ult[c.ult.length - 1]).filter(Boolean);
  const frase = ok.length ? `${tot} eventos${fallos ? `, ${fallos} ${fallos === 1 ? 'fallo' : 'fallos'}` : ', sin fallos'}${rein ? `, ${rein} ${rein === 1 ? 'reinicio' : 'reinicios'}` : ''}.${top.length ? ' Lo último: ' + top.join(' · ') + '.' : ''}` : 'No se ha podido contactar con ninguna Pi.';
  let html = `<section class="card okc" style="gap:6px"><span class="lab" style="color:var(--ok-txt)">En una frase</span><p class="big">${esc(frase)}</p></section>`;
  for (const [cat, c] of ordered) html += `<section class="card sm" style="gap:8px">
      <div class="kv"><span style="display:flex;align-items:center;gap:10px;color:var(--txt)"><span class="tag s c-${cat}">${CATS[cat][1]}</span><b style="font-size:16px;font-weight:600">${CATS[cat][0]}</b></span><span class="mono" style="font-size:18px">${c.n}</span></div>
      <span class="mut" style="color:var(--mut2)">${esc(c.bots.join(' · '))}</span>
      ${c.ult.length ? `<span class="note">${esc(c.ult.slice(-3).join(' · '))}</span>` : ''}</section>`;
  if (!ordered.length && ok.length) html += `<section class="card sm"><span class="mut">Ningún bot ha mandado eventos ${isToday ? 'hoy' : 'ese día'}. Los bots empezarán a aparecer aquí cuando usen pihub (fase 2).</span></section>`;
  html += `<section class="card sm"><h2>Salud del homelab</h2>${R.items.map(x => x.r ? `
      <div class="kv"><span>${esc(x.pi.name)}</span><span class="mono" style="font-size:13px">${x.r.salud.temp_max != null ? `<span class="${x.r.salud.temp_max >= 70 ? 'w' : ''}">${Math.round(x.r.salud.temp_max)}° máx</span>` : '– °'} · ${x.r.fallos} fallos · ${x.r.reinicios} reinicios</span></div>`
      : `<div class="kv"><span>${esc(x.pi.name)}</span><span class="r" style="font-size:13px">${esc(x.error)}</span></div>`).join('')}</section>
    <div class="kv" style="min-height:52px;padding:0 4px"><span>Notificación diaria</span><button class="box" style="padding:0 12px" onclick="openSettings()">${settings.resumen.activo ? esc(settings.resumen.hora) : 'desactivada'}</button></div>`;
  $('#view').innerHTML = html;
}

async function loadHist(piId, rango) {

  catch (e) { hist[piId + rango] = { at: Date.now(), error: e.message } }
  if (route.v === 'pi') render();
}
async function loadDisco(piId) {
  const pi = piById(piId); if (!pi) return;
  try { disco[piId] = await api(pi, '/api/disco', {}, 10000) } catch (e) { disco[piId] = { error: e.message } }
  if (route.v === 'pi') render();
}
function bucket(points, n, rango) {
  if (!points.length) return [];
  const t1 = Date.now() / 1000, span = rango === '7d' ? 7 * 86400 : 86400, t0 = t1 - span, w = span / n;
  const out = Array.from({ length: n }, () => []);
  for (const p of points) { const i = Math.floor((p[0] - t0) / w); if (i >= 0 && i < n) out[i].push(p) }
  return out;
}
function chart(title, unit, buckets, idx, lo, hi, warnAt, color, agg) {
  const vals = buckets.map(b => { const v = b.map(p => p[idx]).filter(x => x != null); return v.length ? (agg === 'max' ? Math.max(...v) : v.reduce((a, c) => a + c, 0) / v.length) : null });
  const real = vals.filter(v => v != null);
  if (!real.length) return `<section class="card sm chart"><div class="hd"><h2>${title}</h2><span>sin datos todavía</span></div><div class="note">El agente guarda una muestra cada 5 minutos: en un rato verás la gráfica.</div></section>`;
  const now = real[real.length - 1], mx = Math.max(...real);
  const bars = vals.map(v => v == null ? `<i style="background:transparent"></i>` : `<i style="height:${Math.max(3, Math.round((Math.min(hi, Math.max(lo, v)) - lo) / (hi - lo) * 64))}px;background:${v >= warnAt ? '#F59E0B' : color}"></i>`).join('');
  return `<section class="card sm chart" style="gap:10px"><div class="hd"><h2>${title}</h2><span>ahora <b>${Math.round(now)}${unit}</b> · máx ${Math.round(mx)}${unit}</span></div>
    <div class="bars" role="img" aria-label="Gráfica de ${title}: ahora ${Math.round(now)}${unit}, máximo ${Math.round(mx)}${unit}">${bars}</div>
    <div class="axis"><span>${route.rango === '7d' ? 'hace 7 días' : 'hace 24 h'}</span><span>ahora</span></div></section>`;
}
const DISK_COL = ['#F59E0B', '#93C5FD', '#D8B4FE', '#86EFAC', '#FDBA74', '#F9A8D4', '#67E8F9'];
function diskCard(piId, s) {
  const d = disco[piId];
  const pct = s.disk.percent, lim = d?.aviso || settings.alerts.disk || 90, full = pct >= Math.min(lim, 85);
  let inner;
  if (!d || d.calculando) inner = `<span class="note">Calculando cuánto ocupa cada bot (tarda unos minutos tras arrancar el agente)…</span>`;
  else if (d.error) inner = `<span class="note">${esc(d.error)}</span>`;
  else {
    const items = d.items.filter(i => i.bytes), sys = items.find(i => i.nombre === 'sistema y otros');
    const rest = items.filter(i => i !== sys);
    const col = i => i === sys ? '#9AA8A1' : DISK_COL[rest.indexOf(i) % DISK_COL.length];
    inner = `<div class="stack">${items.map(i => `<span style="width:${(100 * i.bytes / d.total).toFixed(2)}%;background:${col(i)}"></span>`).join('')}</div>
      <div class="leg">${items.map(i => `<div><span><i style="background:${col(i)}"></i>${esc(i.nombre)}</span><span class="mono">${fmtB(i.bytes)}</span></div>`).join('')}</div>
      <div class="note">Calculado ${agoS(Date.now() / 1000 - d.ts)} · <button class="btn sm" style="min-height:28px;padding:0 8px;font-weight:500" onclick="recalcDisco('${piId}')">Recalcular</button></div>`;
  }
  return `<section class="card sm ${full ? 'warnc' : ''}" style="gap:10px">
    <div class="kv"><h2>${full ? 'SD casi llena' : 'Tarjeta SD'}</h2><span class="mono" style="font-size:13px;${full ? 'color:var(--warn-txt)' : ''}">${fmtGB(s.disk.used)} / ${fmtGB(s.disk.total)} · ${Math.round(pct)} %</span></div>
    ${inner}
    <div class="kv" style="border-top:1px solid ${full ? 'var(--warn-line)' : 'var(--line)'};padding-top:8px"><span>Avisar a partir de</span><button class="box" style="padding:0 10px" onclick="openSettings()">${esc(lim)} %</button></div></section>`;
}

async function runCmd(piId) {
  const cmd = $('#cmd').value.trim(); if (!cmd) return;
  store.set('pimon.hist.' + piId, [cmd, ...store.get('pimon.hist.' + piId, []).filter(h => h !== cmd)].slice(0, 8));
  const out = $('#tout'); out.style.display = ''; out.textContent = '$ ' + cmd + '\n…'; $('#runbtn').disabled = true;

  } catch (e) { out.textContent = `$ ${cmd}\nError: ${e.message}` }

}
async function botRemove(piId, unit, del) {
  if (!confirm(del ? 'Se parará y se borrará el servicio del bot (tu script no se toca). ¿Seguro?' : '¿Quitar este bot de la app? El servicio sigue en la Pi.')) return;
  try { await post(piById(piId), '/api/bots/remove', { unit, delete: del }, 60000); toast(del ? 'Bot borrado' : 'Quitado'); back() }
  catch (e) { toast('Error: ' + e.message, 4000) }
  await refreshOne(piById(piId)); render();
}

// ================================================================ AJUSTES Y NOTIFICACIONES
function openSettings() {
  const t = settings.telegram, a = settings.alerts, rz = settings.resumen, n = NATIVE ? nativeAjustes() : null;
  const tg = `
    <label class="f" for="stok">Token del bot de Telegram</label><input id="stok" value="${esc(t.token)}" autocapitalize="off" spellcheck="false" placeholder="123456789:AAH…">
    <p class="note">Créalo con @BotFather → /newbot. Mejor uno nuevo solo para esto.</p>
    <label class="f" for="schat">Tu chat id</label><div style="display:flex;gap:8px"><input id="schat" value="${esc(t.chat_id)}" placeholder="123456789"><button class="btn" onclick="detectChat()">Detectar</button></div>
    <p class="note">Escribe cualquier cosa a tu bot en Telegram y pulsa «Detectar».</p>
    <div id="schats" class="qk"></div>
    <label class="f" for="shb">Aviso si se va la luz o internet en casa (opcional)</label><input id="shb" value="${esc(settings.heartbeat_url)}" autocapitalize="off" placeholder="https://hc-ping.com/…">
    <p class="note">Crea un «check» gratis en healthchecks.io (periodo 1 min, gracia 5 min) y pega aquí su URL de ping.</p>`;
  showModal(`<h2>Notificaciones y ajustes</h2>
    ${NATIVE ? `
      <label class="chk"><span>Avisos en este móvil</span><input type="checkbox" id="navisos" ${n.avisos ? 'checked' : ''}></label>
      <p class="note">El móvil pregunta a tus Pi cada 30 s por Tailscale y te muestra notificaciones de Android. Si una Pi deja de responder, te avisa el propio móvil.</p>`
    : `<p class="note">Llegan por Telegram. Cada Pi vigila a las demás: si una se apaga o se queda sin red, otra te avisa.</p>${tg}`}
    <label class="f">Resumen diario</label>
    <div style="display:flex;gap:10px;align-items:center"><label class="chk" style="flex:1"><span>Mandarlo cada día a las</span><input type="checkbox" id="rzon" ${rz.activo ? 'checked' : ''}></label><input id="rzh" type="time" value="${esc(rz.hora)}" aria-label="Hora del resumen"></div>
    <label class="f">Avisarme también</label>
    <label class="chk"><span>Cuando una Pi se enciende</span><input type="checkbox" id="sboot" ${a.boot ? 'checked' : ''}></label>
    <label class="chk"><span>Cuando una Pi se apaga o reinicia</span><input type="checkbox" id="sshut" ${a.shutdown ? 'checked' : ''}></label>
    <p class="note">Siempre avisa si una Pi deja de responder, si un bot falla o se cuelga, y de bajo voltaje, temperatura o SD llena.</p>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
      <div><label class="f" for="stemp">Temp. máx °C</label><input id="stemp" type="number" value="${a.temp}"></div>
      <div><label class="f" for="sdisk">SD máx %</label><input id="sdisk" type="number" value="${a.disk}"></div>
      <div><label class="f" for="soff">Caída tras min</label><input id="soff" type="number" value="${n ? n.caida_min : a.offline_after}"></div></div>
    ${NATIVE ? `<details style="margin-top:12px"${t.chat_id ? ' open' : ''}><summary class="mut">Telegram (opcional, para avisos sin Tailscale)</summary>${tg}</details>` : ''}
    <pre id="smsg" style="display:none"></pre>
    <div class="row2"><button class="btn" onclick="testNotify()">Enviar prueba</button><button class="btn pri" onclick="saveSettings()">Guardar</button></div>
    <div class="col"><button class="btn" onclick="closeModal()">Cerrar</button></div>`);
}
function readSettings() {
  const off = +$('#soff').value || 3;
  settings = {
    telegram: { token: $('#stok').value.trim(), chat_id: $('#schat').value.trim() },
    alerts: { boot: $('#sboot').checked, shutdown: $('#sshut').checked, temp: +$('#stemp').value || 75, disk: +$('#sdisk').value || 90, offline_after: off },
    heartbeat_url: $('#shb').value.trim(),
    resumen: { activo: $('#rzon').checked, hora: $('#rzh').value || '22:00' }
  };
  store.set('pimon.settings', settings);
  if (NATIVE) NATIVE.setAjustes(JSON.stringify({ avisos: $('#navisos').checked, caida_min: off }));
}
async function syncAll() {
  return Promise.all(pis.map(async pi => {
    try {
      await post(pi, '/api/settings', { ...settings, peers: pis.filter(o => o.id !== pi.id).map(({ name, url, token }) => ({ name, url, token })) });
      return `✓ ${pi.name}`;
    } catch (e) { return `✗ ${pi.name}: ${e.message}` }
  }));
}
function smsg(t) { const m = $('#smsg'); if (m) { m.style.display = ''; m.textContent = t } }
async function saveSettings() { readSettings(); smsg('Guardando…'); smsg('Guardado en:\n' + (await syncAll()).join('\n')) }
async function testNotify() {
  readSettings(); smsg('Enviando…');
  await syncAll();
  let last = 'Añade antes alguna Raspberry';
  for (const pi of pis) {
    try {
      const r = await post(pi, '/api/notify/test', {}, 15000);
      const lines = [];
      if (NATIVE) {
        NATIVE.revisarYa();
        lines.push(nativeAjustes().avisos ? `✓ Prueba creada en ${pi.name}: la notificación te llega en unos segundos.` : '✗ Los avisos en este móvil están desactivados.');
      }
      if (r.telegram) lines.push(r.telegram_ok ? '✓ Telegram: mensaje enviado.' : `✗ Telegram: ${r.telegram_error}`);
      else if (!NATIVE) lines.push('✗ Telegram no está configurado (pon token y chat id).');
      return smsg(lines.join('\n'));
    } catch (e) { last = `✗ ${pi.name}: ${e.message}` }
  }
  smsg(last);
}
async function detectChat() {
  const token = $('#stok').value.trim();
  if (!token) return toast('Pon primero el token del bot');
  $('#schats').innerHTML = '<span class="note">Buscando…</span>';
  let err;
  for (const pi of pis) {
    try {
      const { chats } = await post(pi, '/api/telegram/detect', { token }, 15000);
      if (!chats.length) return $('#schats').innerHTML = '<span class="note">No hay mensajes. Escribe algo a tu bot en Telegram y vuelve a pulsar.</span>';
      if (chats.length === 1) { $('#schat').value = chats[0].id; return $('#schats').innerHTML = `<span class="note">✓ ${esc(chats[0].name)}</span>` }
      return $('#schats').innerHTML = chats.map(c => `<button onclick="$('#schat').value='${jsq(c.id)}'">${esc(c.name)}</button>`).join('');
    } catch (e) { err = e.message }
  }
  $('#schats').innerHTML = `<span class="note r">${esc(err || 'Añade antes alguna Raspberry')}</span>`;
}

// ================================================================ AÑADIR / EDITAR Pi
function openForm(id) {
  const pi = piById(id) || { name: '', url: 'http://', token: '' };
  showModal(`<h2>${id ? 'Editar' : 'Añadir'} Raspberry</h2>
    <label class="f" for="fname">Nombre</label><input id="fname" value="${esc(pi.name)}" placeholder="homelab1">
    <label class="f" for="furl">Dirección del agente</label><input id="furl" value="${esc(pi.url)}" autocapitalize="off" placeholder="http://100.x.x.x:8790">
    <p class="note">Usa la IP de Tailscale (100.x.x.x) para que funcione fuera de casa y para que las Pi se vigilen entre ellas.</p>
    <label class="f" for="ftok">Token</label><input id="ftok" value="${esc(pi.token)}" autocapitalize="off" placeholder="el que te dio el instalador">
    <p id="fmsg" class="note"></p>
    <div class="row2"><button class="btn" onclick="testForm()">Probar conexión</button><button class="btn pri" onclick="saveForm('${id || ''}')">Guardar</button></div>
    <div class="col"><button class="btn" onclick="closeModal()">Cancelar</button>${id ? `<button class="btn bad" onclick="delPi('${id}')">Quitar de la app</button>` : ''}</div>`);
}
const formPi = () => ({ name: $('#fname').value.trim(), url: $('#furl').value.trim().replace(/\/+$/, ''), token: $('#ftok').value.trim() });
async function testForm() {
  $('#fmsg').textContent = 'Probando…';
  try { const r = await api(formPi(), '/api/ping'); $('#fmsg').innerHTML = `<span class="g">✓ Conectado a ${esc(r.hostname)} (agente ${esc(r.version)})</span>`; if (!$('#fname').value) $('#fname').value = r.hostname }
  catch (e) { $('#fmsg').innerHTML = `<span class="r">✗ ${esc(e.message)}</span>` }
}
function saveForm(id) {
  const f = formPi(); if (!f.name || !/^https?:\/\//.test(f.url) || !f.token) return $('#fmsg').textContent = 'Rellena nombre, dirección (http://…) y token.';
  if (id) Object.assign(piById(id), f); else pis.push({ id: Math.random().toString(36).slice(2, 10), ...f });
  savePis(); closeModal(); refreshAll();
  if (settings.telegram.chat_id) syncAll();
}
function delPi(id) {
  if (!confirm('¿Quitar esta Raspberry de la app?')) return;
  pis = pis.filter(p => p.id !== id); savePis(); delete cache[id]; delete evs[id]; closeModal(); go('inicio', {}, true);
  if (settings.telegram.chat_id) syncAll();
}

// ================================================================ hojas
function showModal(html) { $('#sheet').innerHTML = html; $('#modal').classList.add('on') }
function closeModal() { $('#modal').classList.remove('on') }
$('#modal').onclick = e => { if (e.target.id === 'modal') closeModal() };

// ================================================================ arranque
if (!NATIVE && !pis.length && location.protocol.startsWith('http') && location.port) {
  setTimeout(() => { openForm(); $('#furl').value = location.origin; $('#fname').value = location.hostname.split('.')[0] }, 300);
}
render(); refreshAll();
setInterval(() => {
  if (document.hidden || $('#modal').classList.contains('on')) return;
  if (document.activeElement && ['INPUT', 'SELECT'].includes(document.activeElement.tagName)) return;
  refreshAll();
}, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshAll() });
</script>
</body>
</html>
